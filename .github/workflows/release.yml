name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        type: choice
        description: The type of release.
        default: prerelease
        required: true
        options:
          - current
          - prerelease
          - start-rc
          - stable
      publish:
        description: "True to publish the release to git and GitHub Releases. False creates the release asset only."
        type: boolean
        required: false

env:
  SOMETHING_RELEASER_SEMVER: 1

concurrency:
  group: publish
  cancel-in-progress: true

permissions: write-all

jobs:
  create-release:
    runs-on: ubuntu-latest
    environment:
      name: master branch
    outputs:
      version: ${{ steps.update-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MASTER_GITHUB_PAT || github.token }}
          submodules: recursive
      - uses: anatawa12/something-releaser@v2
      - uses: snow-actions/git-config-user@v1.0.0

      - name: Read package name
        run: |
          name="$(jq -r .name package.json)"
          test -n "$name"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"

      - name: Update Version Name
        id: update-version
        run: |
          # set version name in properties file
          case "$RELEASE_KIND_IN" in
            "current" )
              version="$(get-version)"
              case "$version" in
                *-* ) gh-export-variable PRERELEASE true ;;
                * ) gh-export-variable PRERELEASE false ;;
              esac
              ;;
            "prerelease" )
              set-version "$(version-next "$(get-version)")"
              gh-export-variable PRERELEASE true
              ;;
            "start-rc" )
              set-version "$(version-set-channel "$(get-version)" rc)"
              gh-export-variable PRERELEASE true
              ;;
            "stable" )
              set-version "$(version-set-channel "$(get-version)" stable)"
              gh-export-variable PRERELEASE false
              ;;
            * )
              echo "invalid release kind: $RELEASE_KIND_IN"
              exit 255
              ;;
          esac

          case "$GITHUB_REF_NAME" in
            master | master-* )
              echo "head is master or master-*"
              ;;
            * )
              echo "invalid release kind: $RELEASE_KIND_IN is not allowd for $GITHUB_REF_NAME"
              exit 255
              ;;
          esac

          gh-export-variable VERSION "$(get-version)"
          gh-set-output version "$(get-version)"
        env:
          RELEASE_KIND_IN: ${{ github.event.inputs.release_kind }}

      # region changelog
      - name: Create Changelog
        id: changelog
        if: github.event.inputs.release_kind != 'current'
        uses: anatawa12/sh-actions/changelog/prepare-release@master
        with:
          version: ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          tag-prefix: v
          prerelease-note-heading: |
            Version ${{ env.VERSION }}
            ---

            Install from the S0iRu VPM repository: https://s0iru.github.io/vpm-repos/index.json
          release-note-heading: |
            Version ${{ env.VERSION }}
            ---

            Install from the S0iRu VPM repository: https://s0iru.github.io/vpm-repos/index.json

      - name: Upload CHANGELOG.md
        if: github.event.inputs.release_kind != 'current' && !fromJSON(env.PRERELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG
          path: CHANGELOG.md
      - name: Upload CHANGELOG-PRERELEASE.md
        if: github.event.inputs.release_kind != 'current'
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG-PRERELEASE
          path: CHANGELOG-PRERELEASE.md
      - name: Copy release note
        if: github.event.inputs.release_kind != 'current'
        run: cp "${{ steps.changelog.outputs.release-note }}" release-note.md
      - name: Upload release note
        if: github.event.inputs.release_kind != 'current'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: release-note.md
      - name: Remove release note copy
        if: github.event.inputs.release_kind != 'current'
        run: rm release-note.md
      # endregion changelog

      - name: Commit & tag version
        if: ${{ inputs.publish }}
        run: |
          if ! git diff --quiet; then
            git commit -am "chore: bump version to $VERSION"
          fi
          git tag "v$VERSION"

      # region building
      - name: Prepare build folder
        run: mkdir build

      # region vpm release
      - name: Build VPM release
        run: |
          zip -r "build/$PKG_NAME-$VERSION.zip" . \
            -x 'build' 'build/*' \
            -x '.git' '.git/*' \
            -x '.github' '.github/*' \
            -x '.*'
      - name: Upload VPM release
        uses: actions/upload-artifact@v4
        with:
          name: vpm-package
          path: build/${{ env.PKG_NAME }}-${{ env.VERSION }}.zip
      # endregion vpm release

      # endregion building

      - name: Publish Release
        if: ${{ inputs.publish }}
        run: |
          git push && git push origin "v$VERSION"

      - name: Publish release to github
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 1
          # upload release assets
          gh release create "v$VERSION" \
            ${{ fromJSON(env.PRERELEASE) && '--prerelease' || '' }} \
            --notes "version $VERSION" \
            "package.json" \
            "build/$PKG_NAME-$VERSION.zip"

      - name: Rebuild VPM listing
        if: ${{ inputs.publish }}
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.LISTING_DISPATCH_TOKEN }}
          repository: S0iRu/vpm-repos
          event-type: build-listing

      - name: prepare next release & push
        if: inputs.publish && github.event.inputs.release_kind != 'current' && !fromJSON(env.PRERELEASE)
        run: |
          VERSION="$(version-next "$(get-version)")"
          set-version "$(version-set-channel "$VERSION" beta 0)"
          git commit -am "chore: prepare for next version: $VERSION"
          git push && git push --tags
